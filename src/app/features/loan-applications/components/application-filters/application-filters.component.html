<div class="filters-container">
  <div class="filters-header">
    <div class="filters-title">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" d="M12 3c2.755 0 5.455.232 8.083.678.533.09.917.556.917 1.096v1.044a2.25 2.25 0 0 1-.659 1.591l-5.432 5.432a2.25 2.25 0 0 0-.659 1.591v2.927a2.25 2.25 0 0 1-1.244 2.013L9.75 21v-6.568a2.25 2.25 0 0 0-.659-1.591L3.659 7.409A2.25 2.25 0 0 1 3 5.818V4.774c0-.54.384-1.006.917-1.096A48.32 48.32 0 0 1 12 3Z" />
      </svg>
      <span>Filter & Sort Applications</span>
    </div>

    @if (selectedStatus() !== 'All' || selectedLoanType() !== 'All' || selectedSort() !== 'date-desc') {
      <button class="btn-clear" (click)="onReset()" aria-label="Clear all applied filters">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
        </svg>
        Clear Filters
      </button>
    }
  </div>

  <div class="filters-grid">
    <!-- Status Filter -->
    <div class="filter-group">
      <label for="status-filter" class="filter-label">Status</label>
      <select
        id="status-filter"
        class="filter-select"
        [value]="selectedStatus()"
        (change)="onStatusSelect($event)"
        aria-label="Filter applications by status">
        @for (opt of statusOptions; track opt) {
          <option [value]="opt">{{ opt === 'All' ? 'All Statuses' : opt }}</option>
        }
      </select>
    </div>

    <!-- Loan Type Filter -->
    <div class="filter-group">
      <label for="type-filter" class="filter-label">Loan Type</label>
      <select
        id="type-filter"
        class="filter-select"
        [value]="selectedLoanType()"
        (change)="onLoanTypeSelect($event)"
        aria-label="Filter applications by loan type">
        @for (opt of loanTypeOptions; track opt) {
          <option [value]="opt">{{ opt === 'All' ? 'All Loan Types' : opt }}</option>
        }
      </select>
    </div>

    <!-- Sort By Selector -->
    <div class="filter-group">
      <label for="sort-select" class="filter-label">Sort By</label>
      <select
        id="sort-select"
        class="filter-select"
        [value]="selectedSort()"
        (change)="onSortSelect($event)"
        aria-label="Sort applications list">
        <option value="date-desc">Applied Date — Newest First</option>
        <option value="date-asc">Applied Date — Oldest First</option>
        <option value="amount-desc">Loan Amount — High to Low</option>
        <option value="amount-asc">Loan Amount — Low to High</option>
      </select>
    </div>
  </div>
</div>
