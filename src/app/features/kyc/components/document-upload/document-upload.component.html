<div class="upload-component-wrapper">
  <!-- Hidden File Input -->
  <input
    #fileInput
    type="file"
    accept=".jpg,.jpeg,.png,.pdf,image/jpeg,image/png,application/pdf"
    (change)="onFileChange($event)"
    hidden
    aria-hidden="true" />

  <!-- Drag and Drop Upload Area -->
  @if (!currentFile()) {
    <div
      class="upload-box upload-box-empty"
      (click)="fileInput.click()"
      (drop)="onDrop($event)"
      (dragover)="onDragOver($event)"
      tabindex="0"
      role="button"
      aria-label="Click or drag and drop to select document file (JPG, PNG or PDF up to 2.5 MB)">
      <div class="upload-icon-circle icon-blue">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 14.25v-2.625a3.375 3.375 0 0 0-3.375-3.375h-1.5A1.125 1.125 0 0 1 13.5 7.125v-1.5a3.375 3.375 0 0 0-3.375-3.375H8.25m3.75 9v6m3-3H9m1.5-12H5.625c-.621 0-1.125.504-1.125 1.125v17.25c0 .621.504 1.125 1.125 1.125h12.75c.621 0 1.125-.504 1.125-1.125V11.25a9 9 0 0 0-9-9Z" />
        </svg>
      </div>
      <span class="upload-title">Select file to upload</span>
      <span class="upload-subtitle">(JPG, PNG or PDF, up to 2.5 MB)</span>
      <button type="button" class="btn-select-action" (click)="$event.stopPropagation(); fileInput.click()">
        Select
      </button>
    </div>
  } @else {
    <!-- Uploaded State Box -->
    <div class="upload-box upload-box-success">
      <div class="upload-icon-circle icon-green">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 14.25v-2.625a3.375 3.375 0 0 0-3.375-3.375h-1.5A1.125 1.125 0 0 1 13.5 7.125v-1.5a3.375 3.375 0 0 0-3.375-3.375H8.25m2.25 0H5.625c-.621 0-1.125.504-1.125 1.125v17.25c0 .621.504 1.125 1.125 1.125h12.75c.621 0 1.125-.504 1.125-1.125V11.25a9 9 0 0 0-9-9Z" />
        </svg>
      </div>
      <span class="file-name">{{ currentFile()?.name }}</span>
      <span class="file-size">{{ currentFile()?.formattedSize }}</span>
      <button type="button" class="btn-change-action" (click)="onChangeFileClick(fileInput)">
        Change File
      </button>
    </div>
  }

  <!-- Error Message Banner -->
  @if (validationError()) {
    <div class="upload-error-alert" role="alert">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m9-.75a9 9 0 1 1-18 0 9 9 0 0 1 18 0Zm-9 3.75h.008v.008H12v-.008Z" />
      </svg>
      <span>{{ validationError() }}</span>
    </div>
  }
</div>
