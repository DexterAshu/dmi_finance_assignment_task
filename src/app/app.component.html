<header class="app-white-header">
  <div class="header-container">
    <!-- Brand Logo -->
    <a routerLink="/dashboard" class="header-brand">
      <img src="assets/img/Logo-final-RGB.svg" alt="DMI Finance Logo" class="header-logo-img" />
    </a>

    <!-- Center Search Input -->
    <div class="header-search-wrapper">
      <input
        type="text"
        class="header-search-input"
        placeholder="Search here"
        (input)="onGlobalSearch($event)"
        aria-label="Search leads and applications" />
      <svg class="search-icon-right" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" d="m21 21-5.197-5.197m0 0A7.5 7.5 0 1 0 5.196 5.196a7.5 7.5 0 0 0 10.607 10.607Z" />
      </svg>
    </div>

    <!-- User Profile & 3-Dot Navigation Dropdown -->
    <div class="header-user-widget">
      <div class="welcome-text-container">
        <div class="welcome-line">Welcome, <strong>Samantha</strong></div>
        <div class="sub-info-line">DMI Finance &nbsp;|&nbsp; 291820391821</div>
      </div>

      <!-- Three-Dot Button & Click Dropdown -->
      <div class="nav-dropdown-wrapper">
        <!-- First-Time Visitor Indicator Badge / Pointer -->
        @if (showNavHint() && !isNavMenuOpen()) {
          <div class="nav-hint-badge" (click)="toggleNavMenu($event)">
            <span class="hint-pulse-dot"></span>
            <span class="hint-text">Click here for more pages</span>
            <span class="hint-pointing-arrow">👉</span>
            <button
              type="button"
              class="btn-hint-close"
              (click)="$event.stopPropagation(); dismissNavHint()"
              aria-label="Close indicator">
              ×
            </button>
          </div>
        }

        <button
          type="button"
          class="btn-more-options-circle"
          [class.active]="isNavMenuOpen()"
          [class.has-attention]="showNavHint()"
          (click)="toggleNavMenu($event)"
          aria-label="More navigation options">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.2" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 6.75a.75.75 0 110-1.5.75.75 0 010 1.5zM12 12.75a.75.75 0 110-1.5.75.75 0 010 1.5zM12 18.75a.75.75 0 110-1.5.75.75 0 010 1.5z" />
          </svg>
        </button>

        @if (isNavMenuOpen()) {
          <div class="nav-dropdown-menu">
            <div class="dropdown-header">Navigation Menu</div>

            <a
              routerLink="/applications"
              routerLinkActive="active"
              class="dropdown-item"
              (click)="closeNavMenu()">
              <svg class="dropdown-item-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 14.25v-2.625a3.375 3.375 0 0 0-3.375-3.375h-1.5A1.125 1.125 0 0 1 13.5 7.125v-1.5a3.375 3.375 0 0 0-3.375-3.375H8.25m0 12.75h7.5m-7.5 3H12M10.5 2.25H5.625c-.621 0-1.125.504-1.125 1.125v17.25c0 .621.504 1.125 1.125 1.125h12.75c.621 0 1.125-.504 1.125-1.125V11.25a9 9 0 0 0-9-9Z" />
              </svg>
              <span>Loan Applications</span>
            </a>

            <a
              routerLink="/kyc"
              routerLinkActive="active"
              class="dropdown-item"
              (click)="closeNavMenu()">
              <svg class="dropdown-item-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75L11.25 15 15 9.75m-3-7.036A11.959 11.959 0 013.598 6 11.99 11.99 0 003 9.749c0 5.592 3.824 10.29 9 11.623 5.176-1.332 9-6.03 9-11.622 0-1.31-.21-2.571-.598-3.751A11.959 11.959 0 0112 2.714z" />
              </svg>
              <span>KYB Verification</span>
            </a>

            <a
              routerLink="/dashboard"
              routerLinkActive="active"
              class="dropdown-item"
              (click)="closeNavMenu()">
              <svg class="dropdown-item-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 3v11.25A2.25 2.25 0 0 0 6 16.5h2.25M3.75 3h-1.5m1.5 0h16.5m0 0h1.5m-1.5 0v11.25A2.25 2.25 0 0 1 18 16.5h-2.25m-7.5 0h7.5m-7.5 0l-1 3m8.5-3l1 3m0 0l.5 1.5m-.5-1.5h-9.5m0 0l-.5 1.5m.75-9 3-3 2.12 2.12a1.5 1.5 0 0 0 2.12 0L16.5 7.5" />
              </svg>
              <span>Lead Dashboard</span>
            </a>
          </div>
        }
      </div>
    </div>
  </div>
</header>

<main class="app-main-content">
  <router-outlet></router-outlet>
</main>
