<div class="summary-strip-container">
  <div class="summary-card">
    <div class="summary-icon icon-total">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 14.25v-2.625a3.375 3.375 0 0 0-3.375-3.375h-1.5A1.125 1.125 0 0 1 13.5 7.125v-1.5a3.375 3.375 0 0 0-3.375-3.375H8.25m0 12.75h7.5m-7.5 3H12M10.5 2.25H5.625c-.621 0-1.125.504-1.125 1.125v17.25c0 .621.504 1.125 1.125 1.125h12.75c.621 0 1.125-.504 1.125-1.125V11.25a9 9 0 0 0-9-9Z" />
      </svg>
    </div>
    <div class="summary-content">
      <span class="summary-label">Total Applications</span>
      <span class="summary-value">{{ totalApplications() }}</span>
    </div>
  </div>

  <div class="summary-card">
    <div class="summary-icon icon-pipeline">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" d="M12 6v12m-3-2.818l.879.659c1.171.879 3.07.879 4.242 0 1.172-.879 1.172-2.303 0-3.182C13.536 12.219 12.768 12 12 12c-.725 0-1.45-.22-2.003-.659-1.106-.879-1.106-2.303 0-3.182s2.9-.879 4.006 0l.415.33M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z" />
      </svg>
    </div>
    <div class="summary-content">
      <span class="summary-label">Pipeline Amount</span>
      <span class="summary-value highlight-pipeline">{{ pipelineAmount() | currency:'INR':'symbol':'1.0-0' }}</span>
      <span class="summary-subtext">Pending & Under Review</span>
    </div>
  </div>

  <div class="summary-card">
    <div class="summary-icon icon-approval">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75 11.25 15 15 9.75M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z" />
      </svg>
    </div>
    <div class="summary-content">
      <span class="summary-label">Approval Rate</span>
      <span class="summary-value highlight-approval">{{ approvalRate() }}%</span>
    </div>
  </div>
</div>
